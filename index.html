
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fresh Spin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#090909;padding:22px 16px;border-bottom:1px solid #333;z-index:2}
main,header .inner{max-width:650px;margin:auto}
h1{margin:0;font-size:29px;letter-spacing:-1px}
.gold{color:#c8a45d}
.subtitle{color:#aaa;font-size:12px;margin:8px 0 20px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
button{cursor:pointer;font:inherit}
.tab{background:#222;color:white;border:1px solid #444;border-radius:30px;padding:10px 14px;white-space:nowrap}
.tab.active{background:white;color:black}
.filters{display:flex;gap:8px;margin-top:12px}
input,select{background:#222;color:white;border:1px solid #444;padding:12px;border-radius:9px;min-width:0}
input{flex:1}
select{max-width:125px}
main{padding:18px 16px}
#status{font-size:12px;color:#aaa;margin-bottom:18px}
.card{background:#171717;border:1px solid #333;border-radius:16px;overflow:hidden;margin-bottom:18px}
.art{height:220px;background:#252525;display:flex;align-items:center;justify-content:center;font-size:70px}
.art img{width:100%;height:100%;object-fit:cover}
.info{padding:18px}
.label{color:#c8a45d;font-size:11px;letter-spacing:1px;font-weight:bold}
.card-meta{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.date-added{
  color:#aaa;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.5px;
  text-align:right;
  white-space:normal;
  max-width:110px;
  flex-shrink:0;
}
  h2{margin:9px 0 5px;font-size:24px}
.artist{color:#ccc}
.desc{font-size:13px;color:#aaa;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button,.actions a{padding:12px 10px;border-radius:9px;text-align:center;text-decoration:none;font-size:13px;font-weight:bold}
.play{background:white;color:black;border:0;flex:1}
.play:disabled{background:#444;color:#aaa}
.secondary{background:#222;color:white;border:1px solid #555}
#more{display:none;width:100%;padding:14px;border-radius:10px;background:#222;color:white;border:1px solid #555;margin:12px 0 24px}
footer{text-align:center;color:#888;font-size:12px;padding:30px}
@media(max-width:400px){
.actions{gap:5px}
.actions button,.actions a{font-size:12px;padding:11px 7px}
}
</style>
</head>
<body>
<header>
<div class="inner">
<h1>FRESH SPIN<span class="gold">.</span></h1>
<div class="subtitle">NEW SOUNDS. OLD FAVOURITES. GOOD FINDS.</div>
<nav id="tabs">
<button class="tab active" data-tab="all">All Music</button>
<button class="tab" data-tab="new">Just Dropped</button>
<button class="tab" data-tab="artist">New Artists</button>
<button class="tab" data-tab="old">Rediscover</button>
<button class="tab" data-tab="saved">♡ Saved</button>
</nav>
<div class="filters">
<input id="search" placeholder="Search music..." aria-label="Search music">
<select id="genre">
<option value="all">All genres</option>
<option>Soul</option>
<option>R&B</option>
<option>Funk</option>
<option>Jazz</option>
<option>Hip-hop</option>
<option>Rap</option>
</select>
</div>
</div>
</header>

<main>
<div id="status">Loading music...</div>
<div id="feed"></div>
<button id="more">Load More</button>
</main>

<footer>Discover. Preview. Save. Repeat.</footer>

<script>
let tracks = [];
let tab = "all";
let playing = null;
let visibleCount = 25;

const PAGE_SIZE = 25;
const ALL_LIMIT = 75;
const audio = new Audio();
const $ = id => document.getElementById(id);

let saved = new Set(
  JSON.parse(localStorage.getItem("freshspin-saved") || "[]")
);

let savedTracks = JSON.parse(
  localStorage.getItem("freshspin-saved-tracks") || "{}"
);

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function safeURL(s) {
  try {
    const u = new URL(s);
    return u.protocol === "https:" ? u.href : "";
  } catch {
    return "";
  }
}

function stop() {
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  playing = null;
}

function trackId(t) {
  return String(t.id);
}

// A stable sort key mixes tracks within each date,
// while keeping newer dates ahead of older dates.
function mixKey(t) {
  const value = String(t.added || "") + ":" + trackId(t);
  let hash = 2166136261;
  for (let i = 0; i < value.length; i++) {
    hash ^= value.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function newestFirst(a, b) {
  const dateA = String(a.added || "");
  const dateB = String(b.added || "");

  if (dateA !== dateB) {
    return dateA < dateB ? 1 : -1;
  }

  return mixKey(a) - mixKey(b) ||
    trackId(a).localeCompare(trackId(b));
}

function getTrack(id) {
  return tracks.find(t => trackId(t) === id) ||
    savedTracks[id];
}

function getAvailableTracks() {
  if (tab === "saved") {
    const combined = new Map();

    Object.values(savedTracks).forEach(t => {
      if (t && t.id != null && saved.has(trackId(t))) {
        combined.set(trackId(t), t);
      }
    });

    tracks.forEach(t => {
      if (saved.has(trackId(t))) {
        combined.set(trackId(t), t);
      }
    });

    return [...combined.values()].sort(newestFirst);
  }

  if (tab === "all") {
    return tracks.slice(0, ALL_LIMIT);
  }

  return tracks.filter(t => t.category === tab);
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const g = $("genre").value.toLowerCase();

  const filtered = getAvailableTracks().filter(t => {
    const genre = String(t.genre || "").toLowerCase();
    const searchable = (
      String(t.title || "") + " " +
      String(t.artist || "") + " " +
      String(t.description || "")
    ).toLowerCase();

    return (
      (g === "all" || genre.includes(g)) &&
      searchable.includes(q)
    );
  });

  const shown = filtered.slice(0, visibleCount);

  $("status").textContent =
    filtered.length + " music discoveries" +
    (tab === "all" ? " · latest 75" : "") +
    (filtered.length > shown.length
      ? " · showing " + shown.length
      : "");

  $("feed").innerHTML = shown.map(t => {
    const id = trackId(t);
    const preview = safeURL(t.previewUrl);
    const link = safeURL(t.listenUrl);
    const artwork = safeURL(t.artwork);
const addedDate = String(t.added || "");
const today = new Date().toLocaleDateString("en-CA", {
  timeZone: "America/Toronto",
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
});

const dateLabel = addedDate
  ? addedDate === today
    ? "ADDED TODAY"
    : "ADDED " + new Date(
        addedDate + "T12:00:00"
      ).toLocaleDateString("en-CA", {
        month: "short",
        day: "numeric",
        year: "numeric"
      }).toUpperCase()
  : "";
    const categoryLabel =
      t.category === "old" ? "REDISCOVER" :
      t.category === "artist" ? "NEW ARTISTS" :
      "JUST DROPPED";

    return `<article class="card">
      <div class="art">
        ${artwork
          ? `<img src="${escapeHTML(artwork)}"
               alt="Album artwork" loading="lazy">`
          : "♫"}
      </div>
      <div class="info">
        
<div class="card-meta">
  <div class="label">
    ${escapeHTML(categoryLabel)}
    · ${escapeHTML(t.genre || "")}
  </div>
  ${dateLabel
    ? `<div class="date-added">
         ${escapeHTML(dateLabel)}
       </div>`
    : ""}
</div>

        <h2>${escapeHTML(t.title)}</h2>
        <div class="artist">${escapeHTML(t.artist)}</div>
        <p class="desc">
          ${escapeHTML(t.description ||
            "A music discovery for your collection.")}
          ${t.added
            ? `<span> · Featured ${escapeHTML(t.added)}</span>`
            : ""}
        </p>
        <div class="actions">
          <button class="play"
            data-play="${escapeHTML(id)}"
            ${preview ? "" : "disabled"}>
            ${playing === id
              ? "Ⅱ Pause"
              : preview ? "▶ Preview" : "No preview"}
          </button>
          <a class="secondary"
             href="${escapeHTML(link || "#")}"
             target="_blank"
             rel="noopener noreferrer">
             Full ↗
          </a>
          <button class="secondary"
             data-save="${escapeHTML(id)}">
             ${saved.has(id) ? "♥ Saved" : "♡ Save"}
          </button>
        </div>
      </div>
    </article>`;
  }).join("") || "<p>No discoveries found yet.</p>";

  $("more").style.display =
    filtered.length > visibleCount ? "block" : "none";
}

$("feed").addEventListener("click", async e => {
  const play = e.target.closest("[data-play]");
  const save = e.target.closest("[data-save]");

  if (save) {
    const id = save.dataset.save;
    const track = getTrack(id);

    if (saved.has(id)) {
      saved.delete(id);
      delete savedTracks[id];
    } else {
      saved.add(id);
      if (track) savedTracks[id] = track;
    }

    localStorage.setItem(
      "freshspin-saved",
      JSON.stringify([...saved])
    );

    localStorage.setItem(
      "freshspin-saved-tracks",
      JSON.stringify(savedTracks)
    );

    render();
    return;
  }

  if (play) {
    const id = play.dataset.play;
    const t = getTrack(id);

    if (!t || !safeURL(t.previewUrl)) return;

    if (playing === id) {
      stop();
      render();
      return;
    }

    stop();
    audio.src = safeURL(t.previewUrl);
    playing = id;
    render();

    try {
      await audio.play();
    } catch {
      stop();
      render();
      alert("Preview unavailable.");
    }
  }
});

audio.addEventListener("ended", () => {
  playing = null;
  render();
});

document.querySelectorAll("[data-tab]").forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    visibleCount = PAGE_SIZE;
    stop();

    document.querySelectorAll("[data-tab]").forEach(x => {
      x.classList.remove("active");
    });

    b.classList.add("active");
    render();
  };
});

$("search").oninput = () => {
  visibleCount = PAGE_SIZE;
  render();
};

$("genre").onchange = () => {
  visibleCount = PAGE_SIZE;
  render();
};

$("more").onclick = () => {
  visibleCount += PAGE_SIZE;
  render();
};

// The permanent archive is now the main music source.
fetch("./data/library.json")
  .then(r => {
    if (!r.ok) throw Error("Library unavailable");
    return r.json();
  })
  .then(data => {
    const unique = new Map();

    (data.items || []).forEach(t => {
      if (t && t.id != null) {
        unique.set(trackId(t), t);
      }
    });

    tracks = [...unique.values()].sort(newestFirst);
    render();
  })
  .catch(error => {
    console.error(error);
    $("status").textContent = "Music library unavailable";
    $("feed").innerHTML =
      "<p>We couldn't load the music library. Please try again later.</p>";
  });
</script>
</body>
</html>
