<header>
<div class="inner">
<div class="header-top">
  <div class="header-brand">
    <h1 class="brand-logo">
      <span>RECS</span>
      <span>N’</span>
      <span>EFFECT<span class="gold">.</span></span>
    </h1>
    <div class="subtitle">
  <span>FRESH FINDS.</span>
  <span>TIMELESS SOUNDS.</span>
</div>
  </div>
  <div class="header-icons">
    <div class="genre-popup" id="genrePopup">
  <select id="genre" aria-label="Choose music genre">
    <option value="all">All genres</option>
    <option>Soul</option>
    <option>R&amp;B</option>

  </select>
</div>
  <button type="button" class="header-icon" id="searchIcon" aria-label="Search music" onclick="const panel=document.getElementById('headerFilters'); const popup=document.getElementById('genrePopup'); const opening=!panel.classList.contains('open'); panel.classList.toggle('open',opening); popup.classList.remove('open'); document.getElementById('genreIcon').setAttribute('aria-expanded','false'); document.getElementById('search').style.display='block';">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"></circle>
      <path d="M15.5 15.5L21 21"></path>
    </svg>
  </button>

 <button type="button" class="header-icon" id="savedIcon" aria-label="Saved favourites" onclick="document.querySelector('[data-tab=saved]').click()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.8 8.6c0 4.2-8.8 10.2-8.8 10.2S3.2 12.8 3.2 8.6a4.7 4.7 0 0 1 8.8-2.2 4.7 4.7 0 0 1 8.8 2.2Z"></path>
    </svg>
  </button>

 <button type="button" class="header-icon" id="genreIcon" aria-label="Browse genres" aria-controls="genrePopup" aria-expanded="false" onclick="const popup=document.getElementById('genrePopup'); const opening=!popup.classList.contains('open'); popup.classList.toggle('open',opening); this.setAttribute('aria-expanded',String(opening)); document.getElementById('headerFilters').classList.remove('open'); if(opening)document.getElementById('genre').focus();">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18"></path>
    </svg>
  </button>
</div>
</div>
<nav id="tabs">
<button class="tab active" data-tab="all">All Music</button>
<button class="tab" data-tab="new">Just Dropped</button>
<button class="tab" data-tab="artist">New Artists</button>
<button class="tab" data-tab="old">Rediscover</button>
<button class="tab" data-tab="saved">♡ Saved</button>

<main>
<div id="status">Loading music...</div>
<div id="feed"></div>
<button id="more">Load More</button>
</main>

<footer>Discover. Preview. Save. Repeat.</footer>

<script>
let tracks = [];
let tab = "all";
let playing = null;
let visibleCount = 25;

const PAGE_SIZE = 25;
const ALL_LIMIT = 75;
const audio = new Audio();
const $ = id => document.getElementById(id);

let saved = new Set(
  JSON.parse(localStorage.getItem("freshspin-saved") || "[]")
);

let savedTracks = JSON.parse(
  localStorage.getItem("freshspin-saved-tracks") || "{}"
);

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function safeURL(s) {
  try {
    const u = new URL(s);
    return u.protocol === "https:" ? u.href : "";
  } catch {
    return "";
  }
}

function stop() {
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  playing = null;
}

function trackId(t) {
  return String(t.id);
}

// A stable sort key mixes tracks within each date,
// while keeping newer dates ahead of older dates.
function mixKey(t) {
  const value = String(t.added || "") + ":" + trackId(t);
  let hash = 2166136261;
  for (let i = 0; i < value.length; i++) {
    hash ^= value.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function newestFirst(a, b) {
  const dateA = String(a.added || "");
  const dateB = String(b.added || "");

  if (dateA !== dateB) {
    return dateA < dateB ? 1 : -1;
  }

  return mixKey(a) - mixKey(b) ||
    trackId(a).localeCompare(trackId(b));
}

function getTrack(id) {
  return tracks.find(t => trackId(t) === id) ||
    savedTracks[id];
}

function getAvailableTracks() {
  if (tab === "saved") {
    const combined = new Map();

    Object.values(savedTracks).forEach(t => {
      if (t && t.id != null && saved.has(trackId(t))) {
        combined.set(trackId(t), t);
      }
    });

    tracks.forEach(t => {
      if (saved.has(trackId(t))) {
        combined.set(trackId(t), t);
      }
    });

    return [...combined.values()].sort(newestFirst);
  }

  if (tab === "all") {
    return tracks.slice(0, ALL_LIMIT);
  }

  return tracks.filter(t => t.category === tab);
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const g = $("genre").value.toLowerCase();

  const filtered = getAvailableTracks().filter(t => {
    const genre = String(t.genre || "").toLowerCase();
    const searchable = (
      String(t.title || "") + " " +
      String(t.artist || "") + " " +
      String(t.description || "")
    ).toLowerCase();

    return (
      (g === "all" || genre.includes(g)) &&
      searchable.includes(q)
    );
  });

  const shown = filtered.slice(0, visibleCount);

  $("status").textContent =
    filtered.length + " music discoveries" +
    (tab === "all" ? " · latest 75" : "") +
    (filtered.length > shown.length
      ? " · showing " + shown.length
      : "");

  $("feed").innerHTML = shown.map(t => {
    const id = trackId(t);
    const preview = safeURL(t.previewUrl);
    const link = safeURL(t.listenUrl);
    const artwork = safeURL(t.artwork);
const addedDate = String(t.added || "");
const today = new Date().toLocaleDateString("en-CA", {
  timeZone: "America/Toronto",
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
});

const dateLabel = addedDate
  ? addedDate === today
    ? "ADDED TODAY"
    : "ADDED " + new Date(
        addedDate + "T12:00:00"
      ).toLocaleDateString("en-CA", {
        month: "short",
        day: "numeric",
        year: "numeric"
      }).toUpperCase()
  : "";
    const categoryLabel =
      t.category === "old" ? "REDISCOVER" :
      t.category === "artist" ? "NEW ARTISTS" :
      "JUST DROPPED";

    return `<article class="card">
     <div class="art"
     ${preview ? `
       role="button"
       tabindex="0"
       aria-label="Play or pause song preview"
       data-play="${escapeHTML(id)}"
     ` : ""}>
        ${artwork
          ? `<img src="${escapeHTML(artwork)}"
               alt="Album artwork" loading="lazy">`
                    : "♫"}
        ${preview ? `
  <span class="play-icon" aria-hidden="true">
    ${playing === id
  ? `<svg width="36" height="36" viewBox="0 0 24 24"
       fill="white" aria-hidden="true">
       <rect x="5" y="4" width="5" height="16" rx="1"/>
       <rect x="14" y="4" width="5" height="16" rx="1"/>
     </svg>`
  : `<svg width="42" height="42" viewBox="0 0 24 24"
       fill="white" aria-hidden="true">
       <path d="M7 3.5v17l14-8.5z"/>
     </svg>`}
  </span>
` : ""}
      </div>
      <div class="info">
        
<div class="card-meta">
  <div class="label">
    ${escapeHTML(categoryLabel)}
    · ${escapeHTML(t.genre || "")}
  </div>
  ${dateLabel
    ? `<div class="date-added">
         ${escapeHTML(dateLabel)}
       </div>`
    : ""}
</div>

        <h2>${escapeHTML(t.title)}</h2>
        <div class="artist">${escapeHTML(t.artist)}</div>
        <p class="desc">
          ${escapeHTML(t.description ||
            "A music discovery for your collection.")}
        </p>
        <div class="actions">
          ${link ? `
  <a class="secondary streaming-btn"
     href="${escapeHTML(link)}"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Open in Apple Music">
    <span class="apple-icon">♫</span> Apple Music
  </a>
` : `
  <span class="secondary streaming-btn unavailable"
        aria-label="Apple Music link unavailable">
    <span class="apple-icon">♫</span> Apple Music
  </span>
`}

<a class="secondary streaming-btn"
   href="${escapeHTML(
     "https://open.spotify.com/search/" +
     encodeURIComponent(
       String(t.artist || "") + " " + String(t.title || "")
     )
   )}"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Find song on Spotify">
   <svg class="spotify-icon" width="19" height="19"
     viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="12" r="11" fill="#1ed760"/>
  <path d="M5.5 9c4.7-1.3 9.3-.8 13.2 1.6
           M6.3 12.4c3.9-1 8.1-.5 11.4 1.5
           M7.2 15.6c3.2-.7 6.3-.3 9 1.3"
        fill="none" stroke="#111"
        stroke-width="1.5"
        stroke-linecap="round"/>
</svg> Spotify
</a>
          <button class="secondary"
             data-save="${escapeHTML(id)}">
             ${saved.has(id)
  ? `<svg width="17" height="17" viewBox="0 0 24 24"
       fill="#c8a45d" stroke="#c8a45d"
       stroke-width="2" stroke-linejoin="round"
       aria-hidden="true">
       <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-5-7 5V4a1 1 0 0 1 1-1z"/>
     </svg> Saved`
  : `<svg width="17" height="17" viewBox="0 0 24 24"
       fill="none" stroke="white"
       stroke-width="2" stroke-linejoin="round"
       aria-hidden="true">
       <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-5-7 5V4a1 1 0 0 1 1-1z"/>
     </svg> Save`}
          </button>
          <button class="secondary like-btn"
        type="button"
        disabled
        title="Likes coming soon"
        aria-label="Like feature coming soon">
  <svg width="17" height="17"
       viewBox="0 0 24 24"
       fill="none"
       stroke="white"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/>
  </svg>
  Like
</button>
        </div>
      </div>
    </article>`;
  }).join("") || "<p>No discoveries found yet.</p>";

  $("more").style.display =
    filtered.length > visibleCount ? "block" : "none";
}
// Allow keyboard users to play or pause previews
$("feed").addEventListener("keydown", e => {
  const artwork = e.target.closest(".art[data-play]");

  if (!artwork) return;

  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    artwork.click();
  }
});
$("feed").addEventListener("click", async e => {
  const play = e.target.closest("[data-play]");
  const save = e.target.closest("[data-save]");

  if (save) {
    const id = save.dataset.save;
    const track = getTrack(id);

    if (saved.has(id)) {
      saved.delete(id);
      delete savedTracks[id];
    } else {
      saved.add(id);
      if (track) savedTracks[id] = track;
    }

    localStorage.setItem(
      "freshspin-saved",
      JSON.stringify([...saved])
    );

    localStorage.setItem(
      "freshspin-saved-tracks",
      JSON.stringify(savedTracks)
    );

    render();
    return;
  }

  if (play) {
    const id = play.dataset.play;
    const t = getTrack(id);

    if (!t || !safeURL(t.previewUrl)) return;

    if (playing === id) {
      stop();
      render();
      return;
    }

    stop();
    audio.src = safeURL(t.previewUrl);
    playing = id;
    render();

    try {
      await audio.play();
    } catch {
      stop();
      render();
      alert("Preview unavailable.");
    }
  }
});

audio.addEventListener("ended", () => {
  playing = null;
  render();
});

document.querySelectorAll("[data-tab]").forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    visibleCount = PAGE_SIZE;
    stop();

    document.querySelectorAll("[data-tab]").forEach(x => {
      x.classList.remove("active");
    });

    b.classList.add("active");
    render();
  };
});

$("search").oninput = () => {
  visibleCount = PAGE_SIZE;
  render();
};

$("genre").onchange = () => {
  visibleCount = PAGE_SIZE;
  render();
};

$("more").onclick = () => {
  visibleCount += PAGE_SIZE;
  render();
};

// The permanent archive is now the main music source.
fetch("./data/library.json")
  .then(r => {
    if (!r.ok) throw Error("Library unavailable");
    return r.json();
  })
  .then(data => {
    const unique = new Map();

    (data.items || []).forEach(t => {
      if (t && t.id != null) {
        unique.set(trackId(t), t);
      }
    });

    tracks = [...unique.values()].sort(newestFirst);
    render();
  })
  .catch(error => {
    console.error(error);
    $("status").textContent = "Music library unavailable";
    $("feed").innerHTML =
      "<p>We couldn't load the music library. Please try again later.</p>";
  });
</script>
</body>
</html>
